name: Publish homepage and refresh Scholar metrics

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homepage-pages
  cancel-in-progress: false

jobs:
  homepage:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Scholar widget library
        run: python -m pip install -r requirements.txt
      - name: Restore last successful Scholar data
        uses: actions/cache/restore@v4
        with:
          path: assets/metrics
          key: scholar-data-${{ hashFiles('.bibliometrics.config.json', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: scholar-data-${{ hashFiles('.bibliometrics.config.json', 'requirements.txt') }}-
      - name: Refresh Scholar data with bibliometrics
        id: scholar
        continue-on-error: true
        timeout-minutes: 2
        run: python -m bibliometrics
      - name: Cache successful Scholar data
        if: steps.scholar.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: assets/metrics
          key: scholar-data-${{ hashFiles('.bibliometrics.config.json', 'requirements.txt') }}-${{ github.run_id }}
      - name: Report retained Scholar snapshot
        if: steps.scholar.outcome == 'failure'
        run: echo "::warning::Scholar could not be refreshed; the homepage retains its previous citation data."
      - name: Render homepage with Jinja
        run: |
          jq '{data: .}' assets/metrics/scholar.json | jinja2 templates/index.html.j2 /dev/stdin --format=json --strict --autoescape --outfile=index.html
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html cv.html home.css cobra-demo.css cobra-demo.js cobra-graph.js llms.txt _site/
          cp -R assets llms vendor _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
